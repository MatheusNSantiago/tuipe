[package]
name = "tuipe"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "An offline, adaptive terminal typing trainer"
repository = "https://github.com/matheus/tuipe"

[dependencies]
anyhow = "1.0.100"
csscolorparser = "0.6.2"
crossterm = "0.29.0"
directories = "6.0.0"
rand = { version = "0.9.2", features = ["small_rng"] }
ratatui = "0.30.2"
postcard = { version = "1.1.3", features = ["alloc"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
scopeguard = "1.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.9.8"
termina = "0.3.3"
unicode-normalization = "0.1.24"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.0"
zstd = "0.13.3"

[dev-dependencies]
insta = "1.43.1"
proptest = "1.7.0"
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
