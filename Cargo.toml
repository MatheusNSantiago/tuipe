[package]
name = "tuipe"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "Treinador de digitação adaptativo, offline e nativo do terminal"
repository = "https://github.com/MatheusNSantiago/tuipe"

[dependencies]
anyhow = "1.0.100"
csscolorparser = "0.6.2"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
crossterm = "0.29.0"
crokey = { version = "1.4.0", features = ["serde"] }
directories = "6.0.0"
fontique = { version = "0.11.0", features = ["fontconfig-dlopen"] }
rand = { version = "0.9.2", features = ["small_rng"] }
ratatui = "0.30.2"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
scopeguard = "1.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
signal-hook = "0.3.18"
spline1d = { version = "0.1.0", default-features = false, features = ["alloc"] }
special = { version = "0.13.1", default-features = false, features = ["no_std"] }
supports-color = "3.0.2"
toml = "0.9.8"
termina = "0.3.3"
tempfile = "3.23.0"
unicode-normalization = "0.1.24"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.0"
zstd = "0.13.3"

[dev-dependencies]
insta = "1.43.1"
portable-pty = "0.9.0"
proptest = "1.7.0"

[[bench]]
name = "latencia_input_render"
harness = false

[profile.release]
codegen-units = 1
lto = true
strip = true
